name: pickafeature
description: Flutter SDK for pick a feature - collect user feedback and feature requests directly inside your app. Includes drop-in UI widgets and a typed API client.
version: 1.0.7
homepage: https://pickafeature.com
repository: https://github.com/pickafeature/sdk-flutter
issue_tracker: https://github.com/pickafeature/sdk-flutter/issues

environment:
  sdk: ^3.7.2
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  shared_preferences: ^2.2.2
  uuid: ^4.2.1
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  assets:
    - assets/thumb_up.png
